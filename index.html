<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bulldogs Run 2026 – 3D Route Map (MOA Complex)</title>
<style>
:root{--navy:#142d6e;--gold:#ffc800;--bg:#cfe3f5;--panel:#ffffff;--ink:#1e1e1e}
@media (prefers-color-scheme: dark){:root{--bg:#cfe3f5;--panel:#ffffff;--ink:#1e1e1e}}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#c{position:fixed;inset:0;touch-action:none;inline-size:100%;block-size:100%}
.lgbtn{display:none}
.title{position:fixed;inset-block-start:14px;inset-inline-start:14px;background:var(--navy);border:3px solid var(--gold);border-radius:12px;padding:8px 16px;color:#fff}
.title b{color:var(--gold);font-size:24px;letter-spacing:.5px}.title span{display:block;font-size:13px;opacity:.9}
.legend{position:fixed;inset-block-start:14px;inset-inline-end:14px;background:var(--panel);border:2px solid var(--navy);border-radius:12px;padding:10px 14px;font-size:13px}
.legend h4{margin:0 0 6px;color:var(--navy)}.row{display:flex;align-items:center;gap:8px;margin:4px 0}
.dot{inline-size:18px;block-size:18px;border-radius:50%;color:#fff;font:bold 9px Arial;display:flex;align-items:center;justify-content:center}
.ctrl{position:fixed;inset-block-end:14px;inset-inline-start:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl button{background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.info{background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600;color:var(--navy)}
.cats{position:fixed;inset-block-end:66px;inset-inline-start:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-inline-size:640px}
.cats button{background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:20px;padding:7px 16px;font-weight:700;cursor:pointer}
.cats button.on{background:var(--navy);color:#fff}
.card{background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;flex-basis:100%;border-inline-start:6px solid var(--navy)}
.lbl{position:fixed;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;font:600 12px Arial}
.lbl.b{background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:6px;padding:2px 7px;font-size:13px}
.lbl.r{color:#fff;text-shadow:0 0 3px #28407a,0 0 3px #28407a}
@media (max-width:760px),(max-height:500px){
 .title{inset-block-start:calc(8px + env(safe-area-inset-top));inset-inline-start:8px;padding:5px 10px;border-width:2px;border-radius:9px;max-inline-size:62vw}
 .title b{font-size:16px}.title span{font-size:10.5px}
 .lgbtn{display:block;position:fixed;inset-block-start:calc(8px + env(safe-area-inset-top));inset-inline-end:8px;background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;z-index:5}
 .legend{display:none;inset-block-start:calc(50px + env(safe-area-inset-top));inset-inline-end:8px;font-size:12px;padding:8px 10px;max-block-size:60vh;overflow:auto;z-index:5}
 .legend.open{display:block}
 .cats{inset-inline:8px;inset-block-end:calc(56px + env(safe-area-inset-bottom));gap:6px;max-inline-size:none}
 .cats button{padding:8px 0;flex:1 1 0;font-size:13px}
 .card{font-size:12px;padding:5px 10px}
 .ctrl{inset-inline:8px;inset-block-end:calc(8px + env(safe-area-inset-bottom));gap:6px;flex-wrap:nowrap}
 .ctrl button{padding:8px 6px;font-size:12px;flex:1 1 0;white-space:nowrap}
 .ctrl .t{display:none}
 .info{position:fixed;inset-block-start:calc(64px + env(safe-area-inset-top));inset-inline-start:8px;font-size:11px;padding:4px 8px}
 .lbl{font-size:10px}.lbl.b{font-size:11px;padding:1px 5px}
}
#fin{position:fixed;inset-block-start:22%;inset-inline-start:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;
 background:var(--c,#142d6e);color:#fff;border:4px solid #fff;border-radius:18px;padding:14px 30px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:6;transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#fin b{display:block;font-size:44px;letter-spacing:1px;text-shadow:0 2px 0 #142d6e}#fin small{display:block;font-size:16px;font-weight:700;margin-top:2px}
#fin.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fin small{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#fin .chip{border:2px solid #fff;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:800;text-shadow:0 1px 0 #142d6e}
@media (max-width:760px){#fin b{font-size:30px}#fin .chip{font-size:12px;padding:2px 9px}#fin{padding:10px 18px}}
#snd.off,#tour.off{opacity:.7;border-color:#9aa6c4}
#loop2{position:fixed;inset-block-start:38%;inset-inline-start:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;z-index:6;
 background:#c81e28;color:#fff;border:3px solid #fff;border-radius:14px;padding:8px 20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#loop2 b{display:block;font-size:30px;letter-spacing:1px}#loop2 small{display:block;font-size:13px;font-weight:700}
#loop2.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:760px){#loop2 b{font-size:22px}#loop2 small{font-size:11px}}
/* ===== Mobile layout (phones, portrait + landscape) ===== */
@media (max-width:760px),(max-height:500px){
 .title{max-inline-size:calc(100vw - 110px);padding:5px 10px}
 .title b{display:block;font-size:15px;white-space:nowrap}
 .title span:first-of-type{display:none}
 .title span{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .lgbtn{min-block-size:36px}
 .legend{z-index:8;box-shadow:0 6px 20px rgba(0,0,0,.25)}
 .info{inset-block-start:calc(68px + env(safe-area-inset-top));max-inline-size:calc(100vw - 16px);white-space:normal;line-height:1.3;font-size:10.5px;padding:3px 8px;opacity:.95}
 .lbl.r{display:none}
 .lbl.b{font-size:10px;padding:1px 4px;border-width:1px}
 .ctrl{gap:5px}
 .ctrl button{min-block-size:40px;padding:6px 0;font-size:16px;border-radius:9px}
 .cats{inset-block-end:calc(56px + env(safe-area-inset-bottom));gap:5px}
 .cats button{min-block-size:38px;padding:6px 0;font-size:13px}
 .card{order:-1;font-size:11px;line-height:1.35;padding:4px 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #fin{inset-block-start:30%;max-inline-size:calc(100vw - 32px)}
 #fin b{font-size:28px}#fin .chip{font-size:12px;padding:2px 8px}
 #loop2{inset-block-start:44%;max-inline-size:calc(100vw - 32px);padding:6px 14px}
}
/* phone held sideways: short screen -> put run buttons and controls on one bottom row, hide the description */
@media (max-height:500px) and (orientation:landscape){
 .title span{display:none}.title b{font-size:14px}
 .info{inset-block-start:calc(58px + env(safe-area-inset-top))}
 .card{display:none}
 .cats{inset-inline:8px auto;inset-block-end:calc(8px + env(safe-area-inset-bottom));inline-size:calc(50vw - 12px);flex-wrap:nowrap}
 .ctrl{inset-inline:auto 8px;inline-size:calc(50vw - 12px)}
 .cats button,.ctrl button{min-block-size:34px}
 .legend{max-block-size:calc(100vh - 70px)}
 #fin{inset-block-start:35%}#fin b{font-size:24px}
 #loop2{inset-block-start:50%}
}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#cfe3f5;z-index:20;padding:20px}
#boot .bx{background:#fff;border:3px solid #142d6e;border-radius:14px;padding:18px 20px;max-inline-size:420px;max-inline-size:min(420px,100%);text-align:center;font-size:14px;color:#142d6e;line-height:1.45;box-sizing:border-box}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#boot b{display:block;font-size:18px;margin-block-end:6px}#boot.done{display:none}#boot.err .bx{text-align:start;border-color:#c81e28}
.title{display:flex;align-items:center;gap:12px}
.title .logo{block-size:72px;inline-size:auto;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.title .tt{min-inline-size:0}
@media (max-width:760px),(max-height:500px){.title{gap:8px}.title .logo{block-size:40px}}
@media (max-height:500px) and (orientation:landscape){.title .logo{block-size:32px}}
</style>

 window.addEventListener('error',function(){if(!window.__mapOK){clearTimeout(t);document.getElementById('boot').classList.add('err');document.getElementById('bootmsg').innerHTML='Something blocked the 3D map in this viewer. Open the file in Chrome or Safari with internet on, or watch the route video.';}});})();

// ---- simple synthesized music + finish chime (Web Audio, no files needed) ----
let AC=null,master=null,musicBus=null,soundOn=false,nextBar=0,bar=0;
const N=m=>440*Math.pow(2,(m-69)/12);
function blip(t,f,d,type,vol,bus,rel){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+(rel||d));o.connect(g).connect(bus||musicBus);o.start(t);o.stop(t+(rel||d)+.05)}
function kickAt(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.18);
 g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(musicBus);o.start(t);o.stop(t+.3)}
const PROG=[[60,[60,64,67]],[55,[55,59,62,67]],[57,[57,60,64]],[53,[53,57,60,65]]];const BEAT=60/118;
function scheduleMusic(){if(!soundOn)return;while(nextBar<AC.currentTime+1.2){const [root,ch]=PROG[bar%4];
 for(let b=0;b<4;b++){const tb=nextBar+b*BEAT;kickAt(tb);blip(tb,N(root-24),BEAT*.9,'triangle',.28,musicBus,.35);
  for(let e=0;e<2;e++)blip(tb+e*BEAT/2,N(ch[(b*2+e)%ch.length]+12),BEAT*.5,'sine',.10,musicBus,.18)}
 nextBar+=4*BEAT;bar++}}
setInterval(scheduleMusic,250);
function chime(){if(!soundOn)return;const t=AC.currentTime;
 musicBus.gain.cancelScheduledValues(t);musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(.35,t+.05);musicBus.gain.linearRampToValueAtTime(1,t+2.4);
 [72,76,79,84].forEach((m,k)=>blip(t+k*.09,N(m),1,'sine',.32,master,1.1));blip(t+.38,N(88),1.4,'sine',.22,master,1.5);
 for(let j=0;j<12;j++)blip(t+.3+j*.08,N(84+Math.floor(Math.random()*16)),.2,'sine',.06,master,.12)}
function ensureAC(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
 musicBus=AC.createGain();musicBus.connect(master)}
function setSound(on){ensureAC();soundOn=on;if(on){AC.resume();nextBar=AC.currentTime+.1}else{AC.suspend()}
 $('snd').innerHTML=(soundOn?'🔊':'🔇')+'<span class="t"> Sound: '+(soundOn?'On':'Off')+'</span>';$('snd').classList.toggle('off',!soundOn)}
function toggleSound(){setSound(!soundOn)}
// Sound is ON by default. Browsers only allow audio after the first tap/click/key press, so start it then.
function unlockAudio(){if(soundOn&&AC&&AC.state!=='running'){AC.resume();nextBar=AC.currentTime+.1}}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{capture:true,passive:true}));

$('snd').addEventListener('click',toggleSound);setSound(true);

function setTour(on){tour=on;$('tour').innerHTML='🎬<span class="t"> Auto tour: '+(on?'On':'Off')+'</span>';$('tour').classList.toggle('off',!on)}
document.querySelectorAll('#cats button').forEach(b=>b.addEventListener('click',()=>{setTour(false);select(b.dataset.c)}));
select('0');
$('play').addEventListener('click',()=>{playing=!playing;$('play').innerHTML=playing?'⏸<span class="t"> Pause runner</span>':'▶<span class="t"> Play runner</span>'});
$('tour').addEventListener('click',()=>{const on=!tour;setTour(on);if(on)select('0')});
$('spin').addEventListener('click',()=>{ctl.autoRotate=!ctl.autoRotate;$('spin').innerHTML='⟳<span class="t"> Auto-rotate: '+(ctl.autoRotate?'On':'Off')+'</span>'});

function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;
 const k=cam.aspect<1.3?Math.min(2.4,1.45/Math.max(cam.aspect,.4)):1;cam.fov=cam.aspect<1?55:45;
 const prev=home.clone();home.copy(homeBase).multiplyScalar(k);if(cam.position.distanceTo(prev)<1)cam.position.copy(home);

// ---- finish celebration: confetti burst, ground ring pulse, banner ----
const FIN=V(D.start[0],D.start[1],0);const confetti=[];const rings=[];
const cg=new THREE.PlaneGeometry(.35,.22);const ccols=[0xffc800,0xff5050,0x3cc878,0x50a0ff,0xc85aff,0xffffff];
function celebrate(c){chime();
 for(let j=0;j<(MOBILE?60:120);j++){const m=new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:ccols[j%6],side:THREE.DoubleSide,transparent:true}));
  m.position.set(FIN.x,5,FIN.z);const a=Math.random()*Math.PI*2,s=2+Math.random()*6;
  m.userData={v:new THREE.Vector3(Math.cos(a)*s,6+Math.random()*9,Math.sin(a)*s),r:new THREE.Vector3(Math.random()*8,Math.random()*8,Math.random()*8),t:0};S.add(m);confetti.push(m)}
 for(let k=0;k<3;k++){const rg=new THREE.Mesh(new THREE.RingGeometry(.8,1.2,48),new THREE.MeshBasicMaterial({color:new THREE.Color(`rgb(${c.col})`),transparent:true,side:THREE.DoubleSide}));
  rg.rotation.x=-Math.PI/2;rg.position.set(FIN.x,.15,FIN.z);rg.userData={t:-k*.35};S.add(rg);rings.push(rg)}
 finishers.set(c.name,{col:c.col,until:performance.now()+2700});renderFin(true)}

function renderFin(pop){const f=$('fin');const now=performance.now();for(const [k,v] of finishers)if(v.until<=now)finishers.delete(k);
 if(!finishers.size){f.classList.remove('show');return}
 const list=[...finishers.entries()].sort((a,b)=>cats.findIndex(c=>c.name===a[0])-cats.findIndex(c=>c.name===b[0]));
 f.style.setProperty('--c',list.length===1?`rgb(${list[0][1].col})`:'#142d6e');
 const box=f.querySelector('small');box.textContent='';
 list.forEach(([n,v])=>{const s=document.createElement('span');s.className='chip';s.style.background=`rgb(${v.col})`;s.textContent=n.replace(' RUN','')+' ✓';box.appendChild(s)});
 if(pop){f.classList.remove('show');void f.offsetWidth}f.classList.add('show');
 clearTimeout(f._t);const next=Math.min(...list.map(([,v])=>v.until))-now;f._t=setTimeout(()=>renderFin(false),Math.max(50,next+10))}
function stepFx(dt){
 for(let i=confetti.length-1;i>=0;i--){const m=confetti[i],u=m.userData;u.t+=dt;u.v.y-=14*dt;m.position.addScaledVector(u.v,dt);
  m.rotation.x+=u.r.x*dt;m.rotation.y+=u.r.y*dt;m.rotation.z+=u.r.z*dt;m.material.opacity=Math.max(0,1-u.t/2.8);
  if(u.t>2.8||m.position.y<0){S.remove(m);m.material.dispose();confetti.splice(i,1)}}
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.userData.t+=dt;const t=r.userData.t;if(t<0){r.visible=false;continue}r.visible=true;
  r.scale.setScalar(1+t*4);r.material.opacity=Math.max(0,1-t/1.4);if(t>1.4){S.remove(r);r.geometry.dispose();r.material.dispose();rings.splice(i,1)}}}
const clock=new THREE.Clock();const tmp=new THREE.Vector3();
R.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1);const pace=14;
 let nextSel=null;
 cats.forEach(c=>{if(!c.runner.visible)return;
 if(c.done){}
 else if(c.hold>0){if(playing){c.hold-=dt;if(c.hold<=0){c.hold=0;
   if(tour){ if(sel==='all'){c.done=true;if(cats.every(k=>k.done))nextSel='0'} else nextSel=ORDER[ORDER.indexOf(String(sel))+1] }
   else c.u=0 }}}
 else if(playing){c.u=Math.min(1,c.u+dt*pace/c.len);if(c.u>=1){c.u=1;c.hold=2.8;celebrate(c)}}
  const p=c.cp.getPointAt(c.u),q=c.cp.getPointAt(Math.min(c.u+.002,1));c.runner.position.set(p.x,0.2,p.z);if(p.distanceTo(q)>1e-4)c.runner.lookAt(q.x,0.2,q.z);
  c.body.position.y=1.1+Math.abs(Math.sin(clock.elapsedTime*10))*.15});
 const vis=cats.filter(c=>c.runner.visible);$('prog').textContent=vis.map(c=>c.name.split(' ')[0]+(MOBILE?' ':' · ')+(c.u*c.len*D.scale*c.k/1000).toFixed(1)+(MOBILE?'':' km')).join(MOBILE?'  ':' · ');
 // 2nd-loop pop-up in All view: only while the 12.5KM runner is at the loop-1 -> loop-2 turn
 if(sel==='all'){const c=cats[2];const inTurn=c.runner.visible&&!c.done&&c.u>=D.loopRange[0]&&c.u<=D.loopRange[1];
  loopSign.visible=inTurn;$('loop2').classList.toggle('show',inTurn);
  if(inTurn){const k=1+.15*Math.sin(clock.elapsedTime*8);loopSign.scale.set(6*k,1.5*k,1)}else loopSign.scale.set(6,1.5,1)}
 else $('loop2').classList.remove('show');
 if(nextSel!==null)select(nextSel);
 stepFx(dt);ctl.update();R.render(S,cam);if(!window.__mapOK){window.__mapOK=true;document.getElementById('boot').classList.add('done')}
 for(const l of labels){tmp.copy(l.pos).project(cam);const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;l.d.style.display=vis?'block':'none';
  if(vis){l.d.style.left=((tmp.x+1)/2*innerWidth)+'px';l.d.style.top=((1-tmp.y)/2*innerHeight)+'px'}}});
